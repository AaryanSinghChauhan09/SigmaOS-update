[package]
name = "sigmaos-update"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "System update manager with kernel selection"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-update"
readme = "README.md"
keywords = ["update", "upgrade", "kernel"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-package = { version = "0.1", path = "../SigmaOS-package" }

[profile.release]
opt-level = 3
